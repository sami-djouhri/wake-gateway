# Abhaengigkeits-Ueberwachung fuer den oeffentlichen Snapshot.
#
# Monatlich statt woechentlich und mit kleinem Limit: sicherheitsrelevante
# Updates schickt Dependabot ohnehin sofort, unabhaengig vom Zeitplan. Reine
# Versions-PRs sollen sich nicht schneller stapeln, als sie jemand durchsieht.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # Python-Spruenge ziehen alle Dienste gemeinsam nach, nicht einzeln per PR.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
